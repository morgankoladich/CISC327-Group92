name: Python Tests and Coverage

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: equipment-rental-management

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests and enforce 90% coverage
        run: python -m pytest --cov=app --cov-report=term-missing --cov-report=html --cov-fail-under=90

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: html-coverage
          path: equipment-rental-management/htmlcov/
          if-no-files-found: warn